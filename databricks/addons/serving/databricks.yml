# DriftWatch add-on 1: a Model Serving endpoint for the registered readmission model.
#
# Creating an endpoint needs an existing model version, so this cannot be part of the main
# bundle's first deploy. Deploy it after the job has run once:
#
#   cd databricks/addons/serving
#   databricks bundle deploy -t prod --var model_version=1
#
# CI does this for you when the repository variable DATABRICKS_DEPLOY_SERVING is "true";
# it reads the version from the model's `champion` alias.
bundle:
  name: driftwatch-serving
  databricks_cli_version: ">= 1.23.0"

variables:
  catalog:
    default: workspace
  schema:
    description: Schema of the main bundle (dev mode adds the prefix dev_<user>_).
    default: driftwatch
  model_name:
    description: Registered model name inside the schema (dev mode adds the prefix dev_<user>_).
    default: readmission_model
  model_version:
    description: Model version to serve. CI reads it from the model's champion alias.
    default: "1"
  endpoint_name:
    description: Serving endpoint name (dev mode adds the prefix dev_<user>_).
    default: driftwatch-readmission
  enable_inference_table:
    description: Log requests and responses to a Delta table through AI Gateway. Off by default; may not be available on Free Edition.
    default: false
  enable_usage_tracking:
    description: Record endpoint usage in system tables through AI Gateway. Off by default.
    default: false

resources:
  model_serving_endpoints:
    readmission:
      name: ${var.endpoint_name}
      description: Readmission risk (predict_proba) from the DriftWatch registered model.
      config:
        served_entities:
          - name: readmission
            entity_name: ${var.catalog}.${var.schema}.${var.model_name}
            entity_version: ${var.model_version}
            workload_type: CPU              # Free Edition: CPU only
            workload_size: Small
            scale_to_zero_enabled: true     # no cost while nobody calls it
        traffic_config:
          routes:
            - served_entity_name: readmission
              traffic_percentage: 100
      ai_gateway:
        inference_table_config:
          enabled: ${var.enable_inference_table}
          catalog_name: ${var.catalog}
          schema_name: ${var.schema}
          table_name_prefix: readmission_endpoint
        usage_tracking_config:
          enabled: ${var.enable_usage_tracking}
      tags:
        - key: project
          value: driftwatch

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: dev_${workspace.current_user.short_name}_driftwatch
      model_name: dev_${workspace.current_user.short_name}_readmission_model

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
